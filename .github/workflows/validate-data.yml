name: Validate data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dataset and derived files
        run: python scripts/validate_data.py

      - name: Validate the Kaggle package is current
        run: |
          python scripts/build_kaggle_package.py
          git diff --exit-code -- kaggle/colors.csv kaggle/combinations.csv kaggle/combination_colors.csv
